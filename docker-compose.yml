services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "postgres://notes:notes@db:5432/notes?sslmode=disable",
      "up"
    ]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      APP_HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: notes
      DB_PASSWORD: notes
      DB_NAME: notes
      DB_SSLMODE: disable
      JWT_SECRET: super-secret-key-change-me-in-production-at-least-32-chars
      JWT_EXPIRATION_HOURS: 24
      LOG_LEVEL: debug
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
